<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#1B2B4A"/>
      <stop offset="0.55" stop-color="#0E1830"/>
      <stop offset="1" stop-color="#070C1A"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0FA37A"/>
      <stop offset="0.55" stop-color="#2EE6A6"/>
      <stop offset="1" stop-color="#B8FFE4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E6EEFF"/>
      <stop offset="1" stop-color="#9FB3D9"/>
    </linearGradient>
    <radialGradient id="shine" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#shine)"/>
  <!-- tor wskaźnika -->
  <circle cx="256" cy="256" r="178" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="16"/>
  <!-- łuk: 74% okręgu, start o godz. 7:30 -->
  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#arc)" stroke-width="16" stroke-linecap="round"
          stroke-dasharray="827 1119" transform="rotate(128 256 256)" filter="url(#glow)"/>
  <!-- litera B -->
  <g transform="translate(-8 0)" fill="none" stroke="url(#gold)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <path d="M214 166 V346 M214 166 H266 C304 166 322 188 322 212 C322 238 304 256 266 256 H214 M266 256 C310 256 330 278 330 302 C330 328 310 346 266 346 H214"/>
  </g>
</svg>
